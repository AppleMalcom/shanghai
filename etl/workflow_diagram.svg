<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="520" fill="#ffffff"/>

  <!-- marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- ============ INPUT SOURCES (left column) ============ -->
  <!-- OSM -->
  <rect x="30" y="40" width="230" height="70" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="145" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3b63">OpenStreetMap export</text>
  <text x="145" y="86" text-anchor="middle" font-size="12" fill="#333">metro / subway stations</text>
  <text x="145" y="102" text-anchor="middle" font-size="12" fill="#333">(769 raw records)</text>

  <!-- LiCSAR -->
  <rect x="30" y="225" width="230" height="70" rx="6" fill="#f3eef7" stroke="#8a5aa5" stroke-width="1.5"/>
  <text x="145" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a2a63">COMET-LiCSAR</text>
  <text x="145" y="271" text-anchor="middle" font-size="12" fill="#333">LOS velocity raster (mm/yr)</text>
  <text x="145" y="287" text-anchor="middle" font-size="12" fill="#333">frame 171A_05926_131310</text>

  <!-- WorldPop -->
  <rect x="30" y="330" width="230" height="70" rx="6" fill="#eef7f0" stroke="#4a9a63" stroke-width="1.5"/>
  <text x="145" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5a34">WorldPop 2020</text>
  <text x="145" y="376" text-anchor="middle" font-size="12" fill="#333">population raster</text>
  <text x="145" y="392" text-anchor="middle" font-size="12" fill="#333">China, 100 m, R2025A v1</text>

  <!-- ============ PROCESS NODES ============ -->
  <!-- Clean -->
  <rect x="340" y="35" width="230" height="80" rx="6" fill="#fff6e6" stroke="#c7903a" stroke-width="1.5"/>
  <text x="455" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410">1. Clean OSM records</text>
  <text x="455" y="79" text-anchor="middle" font-size="11.5" fill="#333">drop missing fields,</text>
  <text x="455" y="95" text-anchor="middle" font-size="11.5" fill="#333">duplicate ids and</text>
  <text x="455" y="111" text-anchor="middle" font-size="11.5" fill="#333">duplicate English names</text>

  <!-- Cleaned stations -->
  <rect x="650" y="40" width="190" height="70" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="745" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3b63">Cleaned stations</text>
  <text x="745" y="90" text-anchor="middle" font-size="12" fill="#333">(495 records)</text>

  <!-- Load PostGIS -->
  <rect x="340" y="215" width="230" height="80" rx="6" fill="#fff6e6" stroke="#c7903a" stroke-width="1.5"/>
  <text x="455" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410">2. Load into PostGIS</text>
  <text x="455" y="259" text-anchor="middle" font-size="11.5" fill="#333">build point geometry</text>
  <text x="455" y="275" text-anchor="middle" font-size="11.5" fill="#333">(EPSG:4326),</text>
  <text x="455" y="291" text-anchor="middle" font-size="11.5" fill="#333">GiST spatial index</text>

  <!-- Integrate -->
  <rect x="640" y="215" width="230" height="80" rx="6" fill="#fff6e6" stroke="#c7903a" stroke-width="1.5"/>
  <text x="755" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410">3. Integrate (spatial join)</text>
  <text x="755" y="259" text-anchor="middle" font-size="11.5" fill="#333">sample rasters at stations,</text>
  <text x="755" y="275" text-anchor="middle" font-size="11.5" fill="#333">keep valid LOS pixels,</text>
  <text x="755" y="291" text-anchor="middle" font-size="11.5" fill="#333">compute EWPS</text>

  <!-- Integrated table -->
  <rect x="640" y="360" width="230" height="70" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="755" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3b63">Integrated table</text>
  <text x="755" y="410" text-anchor="middle" font-size="12" fill="#333">(494 stations)</text>

  <!-- Rankings -->
  <rect x="940" y="360" width="135" height="70" rx="6" fill="#fff6e6" stroke="#c7903a" stroke-width="1.5"/>
  <text x="1007" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410">4. Rankings</text>
  <text x="1007" y="400" text-anchor="middle" font-size="11" fill="#333">statistics,</text>
  <text x="1007" y="415" text-anchor="middle" font-size="11" fill="#333">|LOS| and EWPS</text>

  <!-- ============ ARROWS ============ -->
  <!-- OSM -> clean -->
  <line x1="260" y1="75" x2="340" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- clean -> cleaned -->
  <line x1="570" y1="75" x2="650" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- cleaned -> load (down then left) -->
  <path d="M745,110 L745,160 L455,160 L455,215" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- LiCSAR -> load -->
  <line x1="260" y1="260" x2="340" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- WorldPop -> load -->
  <path d="M260,365 L300,365 L300,278 L340,278" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- load -> integrate -->
  <line x1="570" y1="255" x2="640" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- integrate -> integrated table -->
  <line x1="755" y1="295" x2="755" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- integrated table -> rankings -->
  <line x1="870" y1="395" x2="940" y2="395" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
